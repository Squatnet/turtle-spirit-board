<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BBC Micro Turtle</title>
    <style>
        body {
            background-color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: monospace;
            color: #00ff00;
        }
        canvas {
            background-color: #000000;
            border: 2px solid #00ff00;
            margin-bottom: 20px;
        }
        #commandArea {
            width: 800px;
            background: #000000;
            border: 2px solid #00ff00;
            padding: 10px;
        }
        #output {
            height: 100px;
            overflow-y: auto;
            margin-bottom: 10px;
            white-space: pre;
        }
        #commandInput {
            width: 100%;
            background: #000000;
            border: none;
            color: #00ff00;
            font-family: monospace;
            font-size: 16px;
            outline: none;
        }
        #commandInput::before {
            content: ">";
            margin-right: 5px;
        }
    </style>
</head>
<body>
    <canvas id="turtleCanvas" width="800" height="600"></canvas>
    <div id="commandArea">
        <div id="output"></div>
        <div style="display: flex; align-items: center;">
            <span style="margin-right: 10px;">></span>
            <input type="text" id="commandInput" autofocus placeholder="Ask a question or use /command for LOGO commands (e.g., /FD 100)">
        </div>
    </div>
    <script>
        class Turtle {
            drawStar(x, y) {
                const size = 10;
                this.ctx.beginPath();
                for (let i = 0; i < 5; i++) {
                    const angle = (i * 4 * Math.PI) / 5;
                    const px = x + size * Math.cos(angle);
                    const py = y + size * Math.sin(angle);
                    if (i === 0) this.ctx.moveTo(px, py);
                    else this.ctx.lineTo(px, py);
                }
                this.ctx.closePath();
                this.ctx.stroke();
            }

            async sleep(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));
            }

            async executeCommands(commands) {
                for (const command of commands) {
                    this.executeCommand(command);
                    await this.sleep(50); // Faster command execution
                }
            }

            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.x = canvas.width / 2;
                this.y = canvas.height / 2;
                this.angle = 0;
                this.penDown = true;
                this.color = '#00ff00';
                this.size = 15;
                this.letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
                this.numbers = '1234567890'.split('');
                this.words = ['YES', 'NO', 'GOODBYE'];
                this.positions = new Map();
                this.isChanneling = false;
                this.responses = {
                    greetings: ['HELLO', 'HI', 'GREETINGS'],
                    farewell: ['GOODBYE', 'FAREWELL', 'BYE'],
                    affirmative: ['YES', 'INDEED', 'CORRECT'],
                    negative: ['NO', 'WRONG', 'NEVER'],
                    unknown: ['UNCLEAR', 'UNKNOWN', 'MYSTERY'],
                    thinking: ['THINKING', 'SEARCHING', 'SEEKING']
                };
                
                // Set line style
                this.ctx.strokeStyle = this.color;
                this.ctx.lineWidth = 2;
                
                // Initialize output
                this.output = document.getElementById('output');
                this.commandInput = document.getElementById('commandInput');
                this.commandInput.placeholder = 'Ask a question or use /command for LOGO commands (e.g., /FD 100)';
                this.setupCommandHandling();

                // Draw board
                this.drawBoard();
                
                // Welcome message
                this.channelMessage('GREETINGS MORTAL');
            }

            drawBoard() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                this.ctx.font = '24px monospace';
                this.ctx.fillStyle = this.color;
                this.ctx.textAlign = 'center';
                
                // Draw letters in semicircle at top
                const radius = 250;
                const startAngle = Math.PI * 0.7;
                const arcLength = Math.PI * 1.6;
                this.letters.forEach((letter, i) => {
                    const angle = startAngle + (arcLength * i / (this.letters.length - 1));
                    const x = this.canvas.width/2 + Math.cos(angle) * radius;
                    const y = 200 + Math.sin(angle) * radius;
                    this.ctx.fillText(letter, x, y);
                    this.positions.set(letter, {x, y});
                });

                // Draw numbers in row below
                const numberY = 380;
                this.numbers.forEach((num, i) => {
                    const x = this.canvas.width/2 - 200 + (i * 40);
                    this.ctx.fillText(num, x, numberY);
                    this.positions.set(num, {x, y: numberY});
                });

                // Draw words at bottom
                const wordY = 480;
                this.words.forEach((word, i) => {
                    const x = this.canvas.width/2 + (i - 1) * 200;
                    this.ctx.fillText(word, x, wordY);
                    this.positions.set(word, {x, y: wordY});
                });

                // Draw decorative elements
                this.ctx.beginPath();
                // Outer circle
                this.ctx.arc(this.canvas.width/2, this.canvas.height/2, radius + 30, 0, Math.PI * 2);
                this.ctx.stroke();
                // Inner circle
                this.ctx.beginPath();
                this.ctx.arc(this.canvas.width/2, this.canvas.height/2, radius - 30, 0, Math.PI * 2);
                this.ctx.stroke();
                // Draw moon in top center
                this.ctx.beginPath();
                this.ctx.arc(this.canvas.width/2, 150, 20, 0, Math.PI * 2);
                this.ctx.stroke();
                // Draw stars in corners
                this.drawStar(100, 100);
                this.drawStar(700, 100);
                this.drawStar(100, 500);
                this.drawStar(700, 500);
            }

            setupCommandHandling() {
                this.commandInput.addEventListener('keypress', async (e) => {
                    if (e.key === 'Enter') {
                        const input = this.commandInput.value.trim().toUpperCase();
                        this.commandInput.value = '';
                        
                        if (input.startsWith('/')) {
                            // Handle LOGO commands
                            const command = input.substring(1);
                            this.output.textContent += `> ${command}\n`;
                            this.output.scrollTop = this.output.scrollHeight;
                            this.executeCommand(command);
                        } else if (!this.isChanneling && input) {
                            // Handle questions/chat
                            this.output.textContent += `You ask: ${input}\n`;
                            this.output.scrollTop = this.output.scrollHeight;
                            await this.generateResponse(input);
                        }
                    }
                });
            }

            async generateResponse(input) {
                if (this.isChanneling) return;
                this.isChanneling = true;

                // Analyze input for keywords
                const keywords = {
                    greetings: ['HELLO', 'HI', 'GREETINGS', 'HEY'],
                    farewell: ['GOODBYE', 'BYE', 'FAREWELL'],
                    questions: ['WHO', 'WHAT', 'WHERE', 'WHEN', 'WHY', 'HOW'],
                    yesno: ['SHOULD', 'CAN', 'WILL', 'IS', 'ARE', 'AM']
                };

                let response;
                if (keywords.greetings.some(word => input.includes(word))) {
                    response = this.getRandomResponse('greetings');
                } else if (keywords.farewell.some(word => input.includes(word))) {
                    response = this.getRandomResponse('farewell');
                } else if (keywords.questions.some(word => input.includes(word))) {
                    // For complex questions, give a mysterious response
                    response = this.generateMysteriousResponse();
                } else if (keywords.yesno.some(word => input.includes(word))) {
                    // For yes/no questions, randomly choose yes or no with elaboration
                    response = Math.random() < 0.5 ? 
                        this.getRandomResponse('affirmative') :
                        this.getRandomResponse('negative');
                } else {
                    // For unrecognized input, give a cryptic response
                    response = this.getRandomResponse('unknown');
                }

                await this.channelMessage(response);
                this.isChanneling = false;
            }

            getRandomResponse(type) {
                const responses = this.responses[type];
                return responses[Math.floor(Math.random() * responses.length)];
            }

            generateMysteriousResponse() {
                const mysteriousWords = [
                    'SEEK', 'BEYOND', 'VEIL', 'TRUTH',
                    'DARK', 'LIGHT', 'TIME', 'SPACE',
                    'KNOW', 'SEE', 'FEEL', 'HEAR'
                ];
                
                // Generate a 3-4 word mysterious response
                const length = Math.floor(Math.random() * 2) + 3;
                let response = '';
                for (let i = 0; i < length; i++) {
                    const word = mysteriousWords[Math.floor(Math.random() * mysteriousWords.length)];
                    response += (i === 0 ? '' : ' ') + word;
                }
                return response;
            }

            async channelMessage(message) {
                // Start with mysterious movements
                const centerX = this.canvas.width / 2;
                const centerY = this.canvas.height / 2;

                // Circle around before starting (faster)
                const radius = 50;
                for (let angle = 0; angle < Math.PI * 2; angle += Math.PI / 4) { // Fewer steps
                    const x = centerX + Math.cos(angle) * radius;
                    const y = centerY + Math.sin(angle) * radius;
                    await this.moveToPosition(x, y);
                    await this.sleep(50); // Faster circle
                }

                // Spell out the message
                for (const char of message) {
                    if (char === ' ') {
                        await this.sleep(200); // Shorter pause between words
                        continue;
                    }

                    const pos = this.positions.get(char);
                    if (pos) {
                        // Move to letter with dramatic effect (faster)
                        const wobble = 10;
                        await this.moveToPosition(
                            pos.x + Math.random() * wobble - wobble/2,
                            pos.y + Math.random() * wobble - wobble/2
                        );
                        await this.sleep(150); // Faster approach
                        await this.moveToPosition(pos.x, pos.y);
                        await this.sleep(300); // Shorter pause on letter
                    }
                }

                // Return to center
                await this.moveToPosition(centerX, centerY);
                this.output.textContent += `Spirit says: ${message}\n`;
                this.output.scrollTop = this.output.scrollHeight;
            }

            async moveToPosition(targetX, targetY) {
                const dx = targetX - this.x;
                const dy = targetY - this.y;
                const angle = Math.atan2(dy, dx) * 180 / Math.PI;
                const distance = Math.sqrt(dx * dx + dy * dy);

                await this.executeCommands([
                    `RT ${angle - this.angle}`,
                    `FD ${distance}`
                ]);
            }

            draw() {
                // Save current context state
                this.ctx.save();
                
                // Move to planchette position and rotate
                this.ctx.translate(this.x, this.y);
                this.ctx.rotate(this.angle * Math.PI / 180);
                
                // Draw planchette (triangle with viewing hole)
                this.ctx.beginPath();
                this.ctx.strokeStyle = this.color;
                
                // Triangle
                this.ctx.moveTo(-this.size, this.size);
                this.ctx.lineTo(this.size, this.size);
                this.ctx.lineTo(0, -this.size);
                this.ctx.closePath();
                
                // Viewing hole
                this.ctx.moveTo(0, 0);
                this.ctx.arc(0, 0, this.size/4, 0, Math.PI * 2);
                
                this.ctx.stroke();
                
                // Restore context state
                this.ctx.restore();

                // Redraw board
                this.drawBoard();
            }

            clear() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
            }

            executeCommand(command) {
                const parts = command.split(' ');
                const cmd = parts[0];
                const value = parseInt(parts[1]) || 0;

                switch (cmd) {
                    case 'FD':
                    case 'FORWARD':
                        this.forward(value);
                        break;
                    case 'BK':
                    case 'BACK':
                        this.forward(-value);
                        break;
                    case 'RT':
                    case 'RIGHT':
                        this.right(value);
                        break;
                    case 'LT':
                    case 'LEFT':
                        this.left(value);
                        break;
                    case 'PU':
                    case 'PENUP':
                        this.penDown = false;
                        break;
                    case 'PD':
                    case 'PENDOWN':
                        this.penDown = true;
                        break;
                    case 'CLEAR':
                        this.clear();
                        this.x = this.canvas.width / 2;
                        this.y = canvas.height / 2;
                        this.angle = 0;
                        break;
                    case 'HOME':
                        this.x = this.canvas.width / 2;
                        this.y = this.canvas.height / 2;
                        this.angle = 0;
                        break;
                    default:
                        this.output.textContent += `Unknown command: ${cmd}\n`;
                        return;
                }
                this.draw();
            }

            forward(distance) {
                const newX = this.x + distance * Math.cos(this.angle * Math.PI / 180);
                const newY = this.y + distance * Math.sin(this.angle * Math.PI / 180);
                
                if (this.penDown) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(this.x, this.y);
                    this.ctx.lineTo(newX, newY);
                    this.ctx.stroke();
                }
                
                this.x = newX;
                this.y = newY;
            }

            right(angle) {
                this.angle += angle;
            }

            left(angle) {
                this.angle -= angle;
            }
        }

        // Initialize spirit board when page loads
        window.onload = () => {
            const canvas = document.getElementById('turtleCanvas');
            canvas.width = 800;
            canvas.height = 600;
            new Turtle(canvas);
        };
    </script>
</body>
</html>
